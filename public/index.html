<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<!-- interactive-widget: Android Chrome then shrinks the LAYOUT viewport for the keyboard, so the terminal panel (100dvh)
     follows it natively. iOS ignores it — there app.js sizes the panel from visualViewport. -->
<title>Beast Dash</title>

<!--
 Add to Home Screen (iOS) and "Install app" (Chrome).

 On iOS neither a manifest nor HTTPS is needed for a window without Safari's bars — the two
 `apple-` tags below do that over plain HTTP. Chrome/Android need the manifest and HTTPS for
 "Install app".

 `status-bar-style: black` rather than `black-translucent`: translucent lets content slide
 UNDER the status bar, and the header would end up beneath the clock.
-->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Beast">
<meta name="theme-color" content="#0c0d12">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/vendor/plex-v23.20.css">
<link rel="stylesheet" href="/vendor/atom-one-dark-11.9.0.min.css">
<script src="/vendor/highlight-11.9.0.min.js" defer></script>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/f-inbox.css">
<link rel="stylesheet" href="/f-emu.css">
<link rel="stylesheet" href="/f-plans.css">
<link rel="stylesheet" href="/f-plan2.css">
<link rel="stylesheet" href="/f-worktrees.css">
<link rel="stylesheet" href="/f-subagents.css">
<link rel="stylesheet" href="/f-session.css">
<link rel="stylesheet" href="/f-wip.css">
<link rel="stylesheet" href="/f-newproj.css">
<link rel="stylesheet" href="/f-code.css">
<link rel="stylesheet" href="/f-checkpoints.css">
<link rel="stylesheet" href="/f-t3.css">
<link rel="stylesheet" href="/f-review.css">
<link rel="stylesheet" href="/f-icons.css">
<link rel="stylesheet" href="/f-queue.css">
<link rel="stylesheet" href="/f-shell.css">
<link rel="stylesheet" href="/f-when.css">
<link rel="stylesheet" href="/f-quotes.css">
<link rel="stylesheet" href="/f-pin.css">

<link rel="stylesheet" href="/f-chats.css">
<link rel="stylesheet" href="/f-glass.css">
<link rel="stylesheet" href="/f-views.css">
<link rel="stylesheet" href="/f-chat.css">
<link rel="stylesheet" href="/f-cards.css">
</head>
<body>
<!-- Layout: desktop = rail (nav + every live session) | main column; phone = slim header,
     content, bottom tab bar. Every id app.js looks up is kept. -->
<aside class="rail" id="rail">
  <div class="brand"><img class="logo" src="/icon.svg" alt="" aria-hidden="true"><div class="bt"><div class="title">beast</div><div class="sub" id="hostline">connecting…</div></div></div>
  <nav class="nav" id="nav" aria-label="Views">
    <button class="navb on" data-view="home" title="Home"><svg class="ico" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5h-5v5H5a1 1 0 0 1-1-1z"/></svg><span class="nl">Home</span></button>
    <button class="navb" data-view="projects" title="Projects"><svg class="ico" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg><span class="nl">Projects</span> <span class="n" id="proj-count">0</span></button>
    <button class="navb" data-view="code" title="Code"><svg class="ico" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 7-5 5 5 5M16 7l5 5-5 5"/></svg><span class="nl">Code</span></button>
    <button class="navb" data-view="tasks" title="Tasks"><svg class="ico" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="m8.5 12.5 2.5 2.5 4.5-5.5"/></svg><span class="nl">Tasks</span> <span class="n" id="task-count">0</span></button>
  </nav>
  <div class="nav nav2">
    <button class="navb" id="btn-inbox" title="Claude sessions waiting for you, each with a reply box"><svg class="ico" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 13.5 6.5 6a1.5 1.5 0 0 1 1.4-1h8.2a1.5 1.5 0 0 1 1.4 1L20 13.5V18a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M4 13.5h4.5l1 2h5l1-2H20"/></svg><span class="nl">Inbox</span> <span class="n need hidden" id="need-count">0</span></button>
    <button class="navb" id="btn-downloads" title="Downloads on the server (~/Downloads) — files Claude drops for you"><svg class="ico" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/></svg><span class="nl">Downloads</span></button>
  </div>
  <div class="rail-head">
    <button class="rail-t" id="btn-shell" title="Open the sessions: terminal / chat for every tmux session">Sessions <span class="n" id="term-count">0</span></button>
    <button class="rail-add" id="btn-newterm" title="New session — new chat or resume a past conversation" aria-label="New session"><svg class="ico" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
  </div>
  <div class="rail-list" id="rail-list"></div>
  <div class="rail-card"><div class="rail-usage" id="rail-usage"></div><div class="rail-foot" id="rail-foot"></div></div>
  <button class="btn ghost icon rail-gear" id="btn-settings-rail" title="Settings · tunnels · rescan" aria-label="Settings"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="ico" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</aside>

<div class="maincol">
<header class="top">
  <div class="mbrand"><img class="logo" src="/icon.svg" alt="" aria-hidden="true"><span class="title">beast</span><span class="mdot" id="mdot"></span></div>
  <h1 class="vtitle" id="vtitle">Home</h1>
  <div class="search"><svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg><input id="search" placeholder="Filter projects, ports, branches" autocomplete="off"></div>
  <div class="topbtns">
    <button class="btn ghost kbtn" id="btn-palette" title="Jump to any session or project  (⌘K / Ctrl+K)"><svg class="ico" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg><span class="kl">Jump to…</span><kbd>⌘K</kbd></button>
    <button class="btn ghost icon mobi" id="btn-downloads-m" title="Downloads" aria-label="Downloads"><svg class="ico" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/></svg></button>
    <button class="btn ghost icon" id="btn-settings" title="Settings · tunnels · rescan" aria-label="Settings"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="ico" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    <span class="hidden" id="tunnel-count"></span>
  </div>
</header>

<section class="banner hidden" id="banner"></section>
<section class="tunnels hidden" id="tunnels"></section>

<div id="view-home">
  <section class="home-hero" id="home-hero"></section>
  <section class="termstrip" id="termstrip"></section>
  <section class="stats" id="stats"></section>
  <section class="feat-home" id="feat-home"></section>
  <section class="hogsec" id="hogs"></section>
  <section class="running" id="running"></section>
  <section class="wipsec" id="wip-sec"></section>
  <section class="recap-sec" id="recap-sec"></section>
</div>

<div id="view-projects" class="hidden">
  <div class="pbar"><div class="chips" id="filters"></div><span class="sp"></span><button class="btn sm" id="btn-newproj">+ New project</button><span class="dim" id="pbar-hint">Click a project name for details. Claude <svg class="ico" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg> starts a session.</span></div>
  <main id="main"></main>
</div>

<div id="view-tasks" class="hidden"><main id="tasks"></main></div>
<div id="view-code" class="hidden"><main id="code"></main></div>
</div>

<nav class="tabbar" id="tabbar" aria-label="Sections">
  <button class="tb on" data-view="home"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5h-5v5H5a1 1 0 0 1-1-1z"/></svg><span>Home</span></button>
  <button class="tb" data-act="inbox"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 13.5 6.5 6a1.5 1.5 0 0 1 1.4-1h8.2a1.5 1.5 0 0 1 1.4 1L20 13.5V18a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M4 13.5h4.5l1 2h5l1-2H20"/></svg><span>Inbox</span><i class="tbn need hidden" id="tb-need"></i></button>
  <button class="tb" data-act="sessions"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="m7 9 3 3-3 3M13 15h4"/></svg><span>Sessions</span><i class="tbn hidden" id="tb-sess"></i></button>
  <button class="tb" data-view="code"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 7-5 5 5 5M16 7l5 5-5 5"/></svg><span>Code</span></button>
  <button class="tb" data-view="tasks"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="m8.5 12.5 2.5 2.5 4.5-5.5"/></svg><span>Tasks</span><i class="tbn hidden" id="tb-tasks"></i></button>
</nav>

<aside class="drawer" id="drawer"></aside>
<div class="termpanel hidden" id="termpanel"></div>
<div class="scrim hidden" id="scrim"></div>
<div class="toasts" id="toasts"></div>
<div class="menu hidden" id="menu"></div>
<div class="modal hidden" id="modal"></div>
<div class="modal palette hidden" id="palette"></div>

<script src="/f-newproj.js"></script>
<script src="/f-code.js"></script>

<script src="/f-review.js"></script>

<script src="/f-when.js"></script>
<script src="/f-quotes.js"></script>
<script src="/f-pin.js"></script>
<script src="/f-conn.js"></script>
</body>
</html>
