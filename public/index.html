<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<!-- interactive-widget: Android Chrome then shrinks the LAYOUT viewport for the keyboard, so the terminal panel (100dvh)
     follows it natively. iOS ignores it — there app.js sizes the panel from visualViewport. -->
<title>Beast Dash</title>

<!--
 Add to Home Screen (iOS) and "Install app" (Chrome).

 On iOS neither a manifest nor HTTPS is needed for a window without Safari's bars — the two
 `apple-` tags below do that over plain HTTP. Chrome/Android need the manifest and HTTPS for
 "Install app"; the service worker (sw.js) exists only for push notifications, not for offline use.

 `status-bar-style: black` rather than `black-translucent`: translucent lets content slide
 UNDER the status bar, and the header would end up beneath the clock.
-->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Beast">
<meta name="theme-color" content="#0b0e14">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b0e14'/%3E%3Cpath d='M9 8h9a5 5 0 0 1 3.2 8.9A5.5 5.5 0 0 1 18.5 24H9z M13 12v4h5a2 2 0 1 0 0-4z M13 19.5V21h5.5a1.5 1.5 0 1 0 0-3H13z' fill='%235eead4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js" defer></script>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">B</span><div><div class="title">BEAST <span class="dim">dash</span></div><div class="sub" id="hostline">connecting…</div></div></div>
  <nav class="nav" id="nav">
    <button class="navb on" data-view="home">Home</button>
    <button class="navb" data-view="projects">Projects <span class="n" id="proj-count">0</span></button>
    <button class="navb" data-view="tasks">Tasks <span class="n" id="task-count">0</span></button>
  </nav>
  <div class="search"><span class="icon">⌕</span><input id="search" placeholder="Search projects, ports, branches…  ( / )" autocomplete="off"></div>
  <div class="topbtns">
    <button class="btn primary term" id="btn-shell" title="Terminals: live tmux sessions (Claude, dev servers) in the dashboard  (t)"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="ico"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="m7 9 3 3-3 3M13 15h4"/></svg>Terminals <span class="pill" id="term-count">0</span><span class="pill need hidden" id="need-count" title="Claude sessions that need you">0</span></button>
    <button class="btn ghost" id="btn-palette" title="Jump to any session or project  (⌘K / Ctrl+K)">⌘K</button>
    <button class="btn ghost icon" id="btn-settings" title="Settings · tunnels · rescan"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="ico"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    <span class="hidden" id="tunnel-count"></span>
  </div>
</header>

<section class="banner hidden" id="banner"></section>
<section class="tunnels hidden" id="tunnels"></section>

<div id="view-home">
  <section class="stats" id="stats"></section>
  <section class="termstrip" id="termstrip"></section>
  <section class="running" id="running"></section>
</div>

<div id="view-projects" class="hidden">
  <div class="pbar"><div class="chips" id="filters"></div><span class="sp"></span><span class="dim" id="pbar-hint">click a project name for details · Claude ▾ starts a session</span></div>
  <main id="main"></main>
</div>

<div id="view-tasks" class="hidden"><main id="tasks"></main></div>

<aside class="drawer" id="drawer"></aside>
<div class="termpanel hidden" id="termpanel"></div>
<div class="scrim hidden" id="scrim"></div>
<div class="toasts" id="toasts"></div>
<div class="menu hidden" id="menu"></div>
<div class="modal hidden" id="modal"></div>
<div class="modal palette hidden" id="palette"></div>
<script src="/app.js"></script>
</body>
</html>
