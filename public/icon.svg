<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c2740"/><stop offset=".55" stop-color="#0d1322"/><stop offset="1" stop-color="#05070d"/></linearGradient>
<radialGradient id="sheen" cx=".5" cy="0" r=".85" gradientTransform="translate(0 0) scale(1 .9)"><stop offset="0" stop-color="#6db3ff" stop-opacity=".62"/><stop offset=".45" stop-color="#3f7fe0" stop-opacity=".18"/><stop offset="1" stop-color="#3f7fe0" stop-opacity="0"/></radialGradient>
<linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".2"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".35" stop-color="#9cc8ff" stop-opacity=".28"/><stop offset=".75" stop-color="#6d8fc8" stop-opacity=".12"/><stop offset="1" stop-color="#9cc8ff" stop-opacity=".4"/></linearGradient>
<linearGradient id="ink" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#d4e4ff"/></linearGradient>
<radialGradient id="dot" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#d6ecff"/><stop offset=".5" stop-color="#5fb0ff"/><stop offset="1" stop-color="#2f7cf0"/></radialGradient>
<clipPath id="shape"><rect width="512" height="512" rx="115"/></clipPath>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
