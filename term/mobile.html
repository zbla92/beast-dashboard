<!--
  Beast Dash — phone layer on top of ttyd.

  Appended to the end of ttyd's own index.html (see bin/build-term-index.sh). ttyd itself is
  never edited: after a ttyd upgrade, re-download `ttyd-base.html` and rebuild — this layer is
  glued onto the new base.

  Blocks, in order:

  1. SHARED (window.bd): send text to the terminal, toast, upload a file to the dashboard.
     Used by both the phone layer and the desktop helpers.

  2. PHONE (only on `pointer: coarse`, or `?touch=1` to try it on a desktop):
     - key bar: esc/tab/arrows/^C + ⎘ paste, ⋯ menu, ⌨ keyboard
     - ⋯ sheet: Fit, file, enter/newline/shift-tab/home/end/pgup/pgdn/del, tmux copy-mode, ctrl+a..z
     - ⎘: on HTTPS reads the clipboard directly; on plain HTTP (tailnet IP — there is no
       navigator.clipboard) it opens a compose box: long-press → Paste → goes to the terminal as
       ONE paste (bracketed, so Claude Code sees "[Pasted text]" instead of one line per Enter).
     - finger scroll → wheel events → tmux copy-mode (tmux runs on the alternate screen, xterm has
       nothing of its own to scroll).
     - the iOS keyboard does not change the layout viewport: the bar and the terminal follow
       visualViewport. Inside an IFRAME (the dashboard) the iframe cannot see the keyboard — there
       the dashboard shrinks its panel (app.js, fitTermPanel) and the iframe gets a plain resize.
       ⤢ Fit additionally tells the parent (postMessage) and "shakes" tmux: resize to rows-1 and
       back, so a SIGWINCH definitely goes out.

  3. AUTO-RECONNECT on "Press ⏎ to Reconnect" (desktop too).

  4. CLIPBOARD / FILES (desktop too): copy fallback on HTTP, OSC 52 from tmux,
     paste/drop a file → upload → its path typed into the prompt.
-->
<style>
  :root { --bd-bar: 46px; }

  body.bd-touch #terminal-container {
    height: calc(100% - var(--bd-bar) - env(safe-area-inset-bottom, 0px));
    /* We handle swipes ourselves — without this iOS starts its own gesture before
       `preventDefault` runs and the page jumps. */
    touch-action: none;
  }

  /*
   Dock (key bar + the sheet above it). `bottom: 0` on iOS ends up BELOW the keyboard because the
   keyboard is not subtracted from the layout viewport; the script lifts it with translateY
   following visualViewport.
  */
  #bd-dock {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 60;
    display: none;
    transform: translateY(0);
    transition: transform .12s ease-out;
    font: 600 12.5px/1 ui-monospace, "JetBrains Mono", Menlo, monospace;
    -webkit-user-select: none; user-select: none;
  }
  body.bd-touch #bd-dock { display: block; }

  #bd-keys {
    display: flex;
    gap: 5px;
    padding: 5px 6px calc(5px + env(safe-area-inset-bottom, 0px));
    background: #11161f;
    border-top: 1px solid #232c3a;
  }
  #bd-dock button {
    border: 1px solid #2b3646;
    border-radius: 8px;
    background: #1a2130;
    color: #cbd5e1;
    font: inherit;
    height: 36px;
    padding: 0 6px;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  #bd-dock button:active, #bd-dock button.bd-on { background: #263243; color: #5eead4; border-color: #3b4a5e; }
  #bd-dock button.bd-warn { color: #fca5a5; border-color: #4a2a2f; }
  #bd-dock button.bd-acc { color: #5eead4; border-color: rgba(94,234,212,.35); }
  #bd-keys button { flex: 1 1 0; min-width: 0; padding: 0; }
  #bd-keys button.bd-kb { flex: 0 0 40px; }

  /* sheet: lies OVER the terminal, never changes its height (every fit = a resize all the way to tmux) */
  #bd-sheet {
    position: absolute;
    left: 0; right: 0; bottom: 100%;
    max-height: 58vh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 8px 8px 6px;
    background: #0f141c;
    border-top: 1px solid #2b3646;
    box-shadow: 0 -10px 28px rgba(0,0,0,.55);
  }
  #bd-sheet[hidden] { display: none; }
  .bd-sec { margin-bottom: 9px; }
  .bd-sec:last-child { margin-bottom: 2px; }
  .bd-lbl { font-size: 10.5px; color: #64748b; text-transform: uppercase; letter-spacing: .08em; margin: 0 0 5px 2px; }
  .bd-row { display: flex; flex-wrap: wrap; gap: 5px; }
  .bd-row button { flex: 1 1 auto; padding: 0 10px; }
  .bd-row button.bd-x { flex: 0 0 36px; padding: 0; }
  .bd-grid { display: grid; grid-template-columns: repeat(9, 1fr); gap: 4px; }
  .bd-grid button { padding: 0; height: 34px; }
  #bd-compose textarea {
    display: block;
    width: 100%;
    box-sizing: border-box;
    min-height: 88px;
    margin-bottom: 6px;
    padding: 8px 10px;
    font: 16px/1.4 ui-monospace, "JetBrains Mono", Menlo, monospace; /* 16px: iOS zooms the field otherwise */
    background: #0a0d13;
    color: #e6edf3;
    border: 1px solid #2b3646;
    border-radius: 8px;
    resize: vertical;
    -webkit-user-select: text; user-select: text;
  }
  #bd-compose textarea:focus { outline: none; border-color: #5eead4; }
  .bd-opt { display: inline-flex; align-items: center; gap: 6px; color: #94a3b8; font-weight: 500; padding: 0 4px; }
  .bd-opt input { width: 16px; height: 16px; margin: 0; accent-color: #5eead4; }
  .bd-hint { color: #64748b; font-weight: 500; font-size: 11.5px; margin: 0 2px 6px; line-height: 1.35; }
</style>

<script>
/* 1. SHARED — window.bd */
(function () {
  'use strict';

  function term() { return window.term; }

  // Same channel a real keystroke takes (ttyd 1.7.4 / xterm 5.1 has no public `term.input()`).
  // These names survive minification.
  function sendText(txt) {
    var t = term(); if (!t || !txt) return false;
    try {
      var cs = t._core && t._core.coreService;
      if (cs && typeof cs.triggerDataEvent === 'function') { cs.triggerDataEvent(txt, true); return true; }
    } catch (e) {}
    return false;
  }

  // Paste: xterm's `paste()` handles \n→\r and the bracketed-paste wrapper when the program has
  // enabled it (Claude Code does) — a multi-line message arrives as ONE paste, not a series of Enters.
  function pasteText(txt) {
    var t = term(); if (!t || !txt) return false;
    try { if (typeof t.paste === 'function') { t.paste(txt); return true; } } catch (e) {}
    return sendText(txt.replace(/\r?\n/g, '\r'));
  }

  /* small toast (optionally clickable) */
  var toastEl = null, toastTimer = null;
  function toast(msg, isError, onClick) {
    if (!toastEl) {
      toastEl = document.createElement('div');
      toastEl.style.cssText = 'position:fixed;top:10px;right:10px;z-index:99;padding:8px 14px;border-radius:9px;font:12.5px ui-monospace,Menlo,monospace;background:#11161f;border:1px solid #2b3646;color:#cbd5e1;pointer-events:none;transition:opacity .3s;max-width:70vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap';
      document.body.appendChild(toastEl);
    }
    toastEl.textContent = msg;
    toastEl.style.borderColor = isError ? '#b91c1c' : (onClick ? '#5eead4' : '#2b3646');
    toastEl.style.opacity = '1';
    toastEl.style.pointerEvents = onClick ? 'auto' : 'none';
    toastEl.style.cursor = onClick ? 'pointer' : '';
    toastEl.onclick = onClick ? function (e) { e.preventDefault(); e.stopPropagation(); onClick(); } : null;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.style.opacity = '0'; toastEl.style.pointerEvents = 'none'; }, onClick ? 10000 : 2500);
  }

  /* file upload to the dashboard (:8787, CORS) → path into the prompt */
  // Over HTTPS (tailscale serve) the terminal and the dashboard share an origin -> relative path, no CORS.
  var API = location.protocol === 'https:' ? '/api/paste-image' : location.protocol + '//' + location.hostname + ':8787/api/paste-image';

  /*
   Before upload, images are downscaled to at most 1568px on the long edge, in the browser
   (canvas, nothing on the server). Why 1568: Claude reads images in 28×28 patches — tokens =
   (w/28)*(h/28), and the FORMAT DOES NOT MATTER (png = webp = jpeg in tokens). A retina screenshot
   (~3000px) would cost up to 4784 tokens on newer models; at 1568px it is <=1568 and text stays
   readable because that is roughly a laptop's logical (1x) resolution.
   PNG is kept: lossy compression (jpeg/webp) adds artefacts that, per Anthropic's docs, hurt
   exactly the reading of text in screenshots. PDF and GIF pass through untouched.
  */
  var MAX_EDGE = 1568;
  function downscale(file, cb) {
    if (!/^image\/(png|jpeg|webp)$/.test(file.type) || typeof createImageBitmap !== 'function') return cb(file, null);
    createImageBitmap(file).then(function (bm) {
      var longEdge = Math.max(bm.width, bm.height);
      if (longEdge <= MAX_EDGE) { bm.close(); return cb(file, null); }
      var k = MAX_EDGE / longEdge;
      var c = document.createElement('canvas');
      c.width = Math.round(bm.width * k); c.height = Math.round(bm.height * k);
      c.getContext('2d').drawImage(bm, 0, 0, c.width, c.height);
      var info = bm.width + '×' + bm.height + ' → ' + c.width + '×' + c.height;
      bm.close();
      c.toBlob(function (b) { cb(b ? new File([b], 'paste.png', { type: 'image/png' }) : file, b ? info : null); }, 'image/png');
    }).catch(function () { cb(file, null); });
  }

  var MAX_MB = 100;   // same as the server (UPLOAD_MAX)
  function upload(orig) {
    if (orig.size > MAX_MB * 1e6) { toast((orig.name || 'file') + ' is ' + (orig.size / 1e6).toFixed(0) + ' MB — max ' + MAX_MB + ' MB', true); return; }
    toast('⇧ uploading ' + (orig.name || 'image') + (orig.size > 2e6 ? ' (' + (orig.size / 1e6).toFixed(1) + ' MB)' : '') + '…');
    downscale(orig, function (file, info) {
      var ext = ((file.type.split('/')[1] || 'png').replace('jpeg', 'jpg').replace('svg+xml', 'svg'));
      // Keep the original name for everything except downscaled screenshots (those are paste.png anyway)
      // — Claude then sees that it is a csv/json/log.
      var name = (file === orig && orig.name && orig.name !== 'image.png') ? orig.name : '';
      fetch(API + '?ext=' + encodeURIComponent(ext) + (name ? '&name=' + encodeURIComponent(name) : ''), { method: 'POST', body: file })
        .then(function (r) { return r.json(); })
        .then(function (j) {
          if (!j.path) throw new Error(j.error || 'no path');
          sendText(j.path + ' ');
          toast('✓ ' + j.path.split('/').pop() + (info ? ' (' + info + ')' : '') + ' — path typed into the prompt');
        })
        .catch(function (e) { toast('upload failed: ' + e.message, true); });
    });
  }

  function filesOf(dt) {
    var out = [];
    if (!dt) return out;
    var take = function (f) { if (f) out.push(f); };   // any file (csv, json, log, zip …), not only images
    if (dt.files && dt.files.length) for (var i = 0; i < dt.files.length; i++) take(dt.files[i]);
    else if (dt.items) for (var j = 0; j < dt.items.length; j++) if (dt.items[j].kind === 'file') take(dt.items[j].getAsFile());
    return out;
  }

  window.bd = { term: term, sendText: sendText, pasteText: pasteText, toast: toast, upload: upload, filesOf: filesOf };
})();
</script>

<script>
/* 2. PHONE */
(function () {
  'use strict';

  var bd = window.bd;
  // Phones/tablets only. `?touch=1` enables the layer on a desktop for testing.
  var coarse = (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) || /[?&]touch=1/.test(location.search);
  if (!coarse) return;

  // ttyd's page has no viewport meta; irrelevant inside the iframe, but in a separate tab (↗)
  // iOS would render a 980px-wide page without it.
  if (!document.querySelector('meta[name="viewport"]')) {
    var mv = document.createElement('meta'); mv.name = 'viewport';
    mv.content = 'width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content';
    document.head.appendChild(mv);
  }

  function term() { return bd.term(); }

  /* ---------- sending keys ---------- */

  /*
   Two paths, both verified against this ttyd build:
     1. `_core.coreService.triggerDataEvent` — the real-keystroke channel (bd.sendText)
     2. a synthetic `keydown` on xterm's hidden textarea. xterm never checks `isTrusted` there,
        so this passes too, and xterm then computes the escape sequence itself.
   If both fail the button flashes red — better than silently nothing.
  */
  function viaKeydown(ke) {
    if (!ke) return false;
    try {
      var ta = document.querySelector('.xterm-helper-textarea');
      if (!ta) return false;
      ta.dispatchEvent(new KeyboardEvent('keydown', {
        key: ke.key, code: ke.code || ke.key, keyCode: ke.keyCode, which: ke.keyCode,
        ctrlKey: !!ke.ctrlKey, shiftKey: !!ke.shiftKey, altKey: !!ke.altKey,
        bubbles: true, cancelable: true
      }));
      return true;
    } catch (e) {}
    return false;
  }

  /*
   Arrows/home/end have TWO forms: `ESC [ A` and `ESC O A`. Which one applies depends on whether the
   program enabled "application cursor keys" — and that is exactly what the TUIs driven from here do.
  */
  function cursorSeq(letter) {
    var app = false;
    try { app = !!(term().modes && term().modes.applicationCursorKeysMode); } catch (e) {}
    return '\x1b' + (app ? 'O' : '[') + letter;
  }

  function send(k) {
    var seq = k.cursor ? cursorSeq(k.cursor) : k.seq;
    return bd.sendText(seq) || viaKeydown(k.ke);
  }

  function flash(b) { b.style.borderColor = '#b91c1c'; setTimeout(function () { b.style.borderColor = ''; }, 400); }
  function key(k) { return function (b) { if (!send(k)) flash(b); }; }

  var KEYS = [
    { t: 'esc', seq: '\x1b', ke: { key: 'Escape', keyCode: 27 } },
    { t: 'tab', seq: '\t',   ke: { key: 'Tab', keyCode: 9 } },
    { t: '↑',   cursor: 'A',  ke: { key: 'ArrowUp', keyCode: 38 } },
    { t: '↓',   cursor: 'B',  ke: { key: 'ArrowDown', keyCode: 40 } },
    { t: '←',   cursor: 'D',  ke: { key: 'ArrowLeft', keyCode: 37 } },
    { t: '→',   cursor: 'C',  ke: { key: 'ArrowRight', keyCode: 39 } },
    { t: '^C',  seq: '\x03', ke: { key: 'c', code: 'KeyC', keyCode: 67, ctrlKey: true }, cls: 'bd-warn' }
  ];

  var KEYS2 = [
    { t: '↵ enter',    seq: '\r',      ke: { key: 'Enter', keyCode: 13 } },
    { t: '⌥↵ newline', seq: '\x1b\r',  ke: { key: 'Enter', keyCode: 13, altKey: true } },   // Claude Code: new line in the prompt (meta+enter)
    { t: '⇧tab',       seq: '\x1b[Z',  ke: { key: 'Tab', keyCode: 9, shiftKey: true } },    // Claude Code: cycles the mode (plan / auto-accept)
    { t: 'home',       cursor: 'H',    ke: { key: 'Home', keyCode: 36 } },
    { t: 'end',        cursor: 'F',    ke: { key: 'End', keyCode: 35 } },
    { t: 'pgup',       seq: '\x1b[5~', ke: { key: 'PageUp', keyCode: 33 } },
    { t: 'pgdn',       seq: '\x1b[6~', ke: { key: 'PageDown', keyCode: 34 } },
    { t: 'del',        seq: '\x1b[3~', ke: { key: 'Delete', keyCode: 46 } },
    { t: '^D', seq: '\x04', ke: { key: 'd', code: 'KeyD', keyCode: 68, ctrlKey: true }, cls: 'bd-warn' },
    { t: '^Z', seq: '\x1a', ke: { key: 'z', code: 'KeyZ', keyCode: 90, ctrlKey: true }, cls: 'bd-warn' },
    { t: '^L', seq: '\x0c', ke: { key: 'l', code: 'KeyL', keyCode: 76, ctrlKey: true } },
    { t: '^U', seq: '\x15', ke: { key: 'u', code: 'KeyU', keyCode: 85, ctrlKey: true } }
  ];

  // tmux: ^B [ = copy-mode (scroll/select), q = leave it; ^B d = detach this client
  var TMUX = [
    { t: '^B prefix',    seq: '\x02' },
    { t: '[ copy-mode',  seq: '\x02[' },
    { t: 'q exit copy',  seq: 'q' }
  ];

  /* ---------- buttons ---------- */

  /*
   `button`: listens to `touchstart`, not `click`.

   A tap on a button otherwise steals focus from the terminal, the keyboard collapses and the next
   key has nowhere to go. On iOS `touchstart` + `preventDefault` is the only reliable way to stop
   that. `pointerdown` sits next to it for mouse and pen; for a finger it is skipped (pointerType)
   so Esc is not sent twice.

   `gestureButton`: `touchend`/`click` — for actions that MAY (or must) move focus or need a
   "real" user gesture: focus() on the compose box, opening the file picker, reading the clipboard.
  */
  function button(label, action, cls, title) {
    var b = document.createElement('button');
    b.type = 'button'; b.textContent = label;
    if (cls) b.className = cls;
    if (title) b.title = title;
    function fire(e) { e.preventDefault(); e.stopPropagation(); action(b, e); }
    b.addEventListener('touchstart', fire, { passive: false });
    b.addEventListener('pointerdown', function (e) { if (e.pointerType === 'touch') return; fire(e); });
    b.addEventListener('click', function (e) { e.preventDefault(); });
    return b;
  }
  function gestureButton(label, action, cls, title) {
    var b = document.createElement('button');
    b.type = 'button'; b.textContent = label;
    if (cls) b.className = cls;
    if (title) b.title = title;
    var last = 0;
    function fire(e) {
      e.preventDefault(); e.stopPropagation();
      var now = Date.now(); if (now - last < 350) return; last = now;
      action(b, e);
    }
    b.addEventListener('touchend', fire, { passive: false });
    b.addEventListener('click', fire);
    return b;
  }

  /* ---------- dock: sheet + key bar ---------- */

  var dock = document.createElement('div'); dock.id = 'bd-dock';
  var sheet = document.createElement('div'); sheet.id = 'bd-sheet'; sheet.hidden = true;
  var bar = document.createElement('div'); bar.id = 'bd-keys';
  dock.appendChild(sheet); dock.appendChild(bar);

  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
  function section(title) { var s = el('div', 'bd-sec'); if (title) s.appendChild(el('div', 'bd-lbl', title)); return s; }

  var paneKeys = el('div'), paneCompose = el('div'); paneCompose.id = 'bd-compose';
  sheet.appendChild(paneKeys); sheet.appendChild(paneCompose);

  var open = null;   // null | 'keys' | 'compose'
  var btnMenu, btnPaste;
  function openPane(which) {
    open = which;
    sheet.hidden = !which;
    paneKeys.hidden = which !== 'keys';
    paneCompose.hidden = which !== 'compose';
    if (btnMenu) btnMenu.classList.toggle('bd-on', which === 'keys');
    if (btnPaste) btnPaste.classList.toggle('bd-on', which === 'compose');
  }
  function closePane() { openPane(null); }
  function focusTerm() { try { term().focus(); } catch (e) {} }

  /* ---------- Fit: when tmux does not follow the keyboard ---------- */

  /*
   Order:
     1. tell the parent (dashboard) to re-measure its visualViewport and shrink the panel — the
        iframe cannot see the keyboard from its own visualViewport;
     2. measure our own height and refit;
     3. "shake" tmux: resize to rows-1, then fit back. When the size is the same as before, xterm
        does not fire onResize and ttyd sends nothing — and that is exactly the case when tmux is
        "stuck" on another client's size. Two resizes = two SIGWINCHs; tmux (window-size latest)
        takes this client as authoritative and redraws.
  */
  function fitHard(b) {
    try { if (window.parent !== window) window.parent.postMessage({ bd: 'fit' }, '*'); } catch (e) {}
    layout();
    var t = term();
    if (!t) { if (b) flash(b); return; }
    try { t.resize(Math.max(2, t.cols), Math.max(2, t.rows - 1)); } catch (e) {}
    setTimeout(function () {
      layout();
      try { if (t.fit) t.fit(); else window.dispatchEvent(new Event('resize')); } catch (e) {}
      setTimeout(function () { bd.toast('⤢ fit ' + t.cols + '×' + t.rows); }, 300);   // once ttyd/tmux have settled
    }, 90);
  }

  /* ---------- file from the phone ---------- */

  var inpFile = document.createElement('input');
  inpFile.type = 'file'; inpFile.multiple = true;   // any file
  inpFile.style.display = 'none';
  inpFile.addEventListener('change', function () {
    var fs = bd.filesOf({ files: inpFile.files });
    if (!fs.length) return;
    fs.forEach(bd.upload);
    inpFile.value = '';
    closePane();
  });
  dock.appendChild(inpFile);

  /* ---------- paste / compose ---------- */

  var ta = document.createElement('textarea');
  ta.placeholder = 'Long-press here → Paste.  Or type (autocorrect works).';
  ta.setAttribute('autocapitalize', 'off'); ta.setAttribute('autocomplete', 'off'); ta.setAttribute('spellcheck', 'false');
  ta.rows = 3;

  var AUTO_KEY = 'bd-autosend';
  var autoSend = document.createElement('input'); autoSend.type = 'checkbox';
  try { autoSend.checked = localStorage.getItem(AUTO_KEY) !== '0'; } catch (e) { autoSend.checked = true; }
  autoSend.addEventListener('change', function () { try { localStorage.setItem(AUTO_KEY, autoSend.checked ? '1' : '0'); } catch (e) {} });

  function sendCompose(txt, enter) {
    txt = txt == null ? ta.value : txt;
    if (!txt) { flash(btnPaste); return; }
    if (!bd.pasteText(txt)) { bd.toast('terminal not ready', true); return; }
    if (enter) setTimeout(function () { bd.sendText('\r'); }, 150);
    ta.value = '';
    closePane();
    bd.toast('⎘ pasted ' + txt.length + ' chars' + (enter ? ' + ↵' : ''));
    focusTerm();
  }

  // Paste into the box: with an image in the clipboard the global handler (block 4) uploads it;
  // with text and "send on paste" on, the text goes straight to the terminal — that is the
  // "button that pastes the clipboard" on HTTP: ⎘ → long-press → Paste → done.
  ta.addEventListener('paste', function (e) {
    var dt = e.clipboardData; var txt = dt && dt.getData ? dt.getData('text/plain') : '';
    if (!txt) return;
    if (autoSend.checked && !ta.value) { e.preventDefault(); sendCompose(txt, false); }
  });

  function openCompose() {
    openPane('compose');
    ta.focus();
    try { ta.setSelectionRange(ta.value.length, ta.value.length); } catch (e) {}
  }

  /*
   ⎘ on the bar. On HTTPS (or localhost) `navigator.clipboard` exists: image → upload, text →
   paste, no box at all (iOS asks "Paste?" with one tap). On the tailnet's plain HTTP it does
   NOT exist — the compose box opens instead.
  */
  function pasteFromClipboard() {
    var nc = navigator.clipboard;
    if (!nc || !nc.readText) { openCompose(); return; }
    var p = nc.read ? nc.read().then(function (items) {
      var image = null, hasText = false;
      (items || []).forEach(function (it) {
        (it.types || []).forEach(function (ty) { if (ty === 'text/plain') hasText = true; else if (/^image\//.test(ty) && !image) image = { it: it, ty: ty }; });
      });
      if (!hasText && image) return image.it.getType(image.ty).then(function (blob) { bd.upload(new File([blob], 'clip.' + image.ty.split('/')[1], { type: image.ty })); return true; });
      return nc.readText();
    }) : nc.readText();
    p.then(function (txt) {
      if (txt === true) return;
      if (txt) { bd.pasteText(txt); bd.toast('⎘ pasted ' + txt.length + ' chars'); focusTerm(); }
      else openCompose();
    }).catch(function () { openCompose(); });
  }

  /* ---------- building the sheet ---------- */

  var sActions = section(null), rActions = el('div', 'bd-row');
  rActions.appendChild(button('⤢ fit', fitHard, 'bd-acc', 'refit the terminal (when tmux does not follow the keyboard)'));
  rActions.appendChild(gestureButton('📎 file', function () { inpFile.click(); }, null, 'image/PDF/CSV/any file (up to 100 MB) → upload → path into the prompt'));
  rActions.appendChild(gestureButton('⎘ paste', pasteFromClipboard, null, 'paste the clipboard'));
  rActions.appendChild(button('✕', closePane, 'bd-x'));
  sActions.appendChild(rActions); paneKeys.appendChild(sActions);

  var sKeys = section('keys'), rKeys = el('div', 'bd-row');
  KEYS2.forEach(function (k) { rKeys.appendChild(button(k.t, key(k), k.cls)); });
  sKeys.appendChild(rKeys); paneKeys.appendChild(sKeys);

  var sTmux = section('tmux'), rTmux = el('div', 'bd-row');
  TMUX.forEach(function (k) { rTmux.appendChild(button(k.t, key(k))); });
  sTmux.appendChild(rTmux); paneKeys.appendChild(sTmux);

  var sCtrl = section('ctrl +'), gCtrl = el('div', 'bd-grid');
  'abcdefghijklmnopqrstuvwxyz'.split('').forEach(function (c) {
    var code = c.charCodeAt(0) - 96;
    gCtrl.appendChild(button('^' + c.toUpperCase(), key({ seq: String.fromCharCode(code), ke: { key: c, code: 'Key' + c.toUpperCase(), keyCode: c.charCodeAt(0) - 32, ctrlKey: true } }), c === 'c' || c === 'd' || c === 'z' ? 'bd-warn' : null));
  });
  sCtrl.appendChild(gCtrl); paneKeys.appendChild(sCtrl);

  // compose
  var hint = el('div', 'bd-hint', 'This is plain HTTP, so the browser refuses direct clipboard access. Long-press the box → Paste; the text goes to the terminal as one paste.');
  if (navigator.clipboard && navigator.clipboard.readText) hint.textContent = 'The clipboard had no text. Long-press the box → Paste, or type.';
  paneCompose.appendChild(hint);
  paneCompose.appendChild(ta);
  var rC = el('div', 'bd-row');
  rC.appendChild(gestureButton('send', function () { sendCompose(null, false); }, 'bd-acc', 'paste into the terminal'));
  rC.appendChild(gestureButton('send + ↵', function () { sendCompose(null, true); }, 'bd-acc', 'paste and press Enter'));
  rC.appendChild(gestureButton('🖼', function () { inpFile.click(); }, 'bd-x', 'file'));
  var opt = el('label', 'bd-opt'); opt.appendChild(autoSend); opt.appendChild(document.createTextNode('send on paste'));
  rC.appendChild(opt);
  rC.appendChild(gestureButton('✕', function () { ta.blur(); closePane(); focusTerm(); }, 'bd-x'));
  paneCompose.appendChild(rC);
  openPane(null);

  /* ---------- key bar ---------- */

  KEYS.forEach(function (k) { bar.appendChild(button(k.t, key(k), k.cls)); });
  btnPaste = gestureButton('⎘', function () { if (open === 'compose') { ta.blur(); closePane(); focusTerm(); } else pasteFromClipboard(); }, 'bd-acc', 'paste');
  bar.appendChild(btnPaste);
  btnMenu = button('⋯', function () { openPane(open === 'keys' ? null : 'keys'); }, null, 'more keys, fit, file');
  bar.appendChild(btnMenu);
  // Summon / dismiss the keyboard — on a phone you otherwise have to guess where exactly to tap.
  bar.appendChild(button('⌨', function () {
    var x = document.querySelector('.xterm-helper-textarea');
    if (!x) return;
    if (document.activeElement === x) { x.blur(); } else { x.focus(); }
  }, 'bd-kb'));

  document.body.appendChild(dock);
  document.body.classList.add('bd-touch');

  /* ---------- keyboard: dock and terminal ---------- */

  /*
   When the iOS keyboard opens, the layout viewport does NOT change, only the visual one:
     dock      `position: fixed; bottom: 0` is computed against the layout viewport, so it ends
               up under the keyboard.
     terminal  keeps its height, so the line being typed falls behind the keyboard.
   So BOTH are driven from `visualViewport`: the dock is lifted by the amount eaten, and the
   terminal's height is set to what is actually visible, then refit. Inside an iframe the
   visualViewport == the iframe's window (it cannot see the keyboard) — there the parent shrinks
   the dashboard and this only follows the resize.

   No single event is waited for: after focus we poll per frame for a short while as the
   keyboard slides in.
  */
  var vv = window.visualViewport;

  function barHeight() { return bar.offsetHeight || 46; }

  // Refitting is expensive — every `fit` sends a new size through ttyd all the way to tmux.
  // During the animation the height changes every frame, so the fit runs once it settles.
  var fitTimer = null;
  function scheduleFit() {
    clearTimeout(fitTimer);
    fitTimer = setTimeout(function () {
      try {
        var t = term();
        if (t && t.fit) t.fit(); else window.dispatchEvent(new Event('resize'));
      } catch (e) {}
    }, 120);
  }

  function layout() {
    var visible = vv ? vv.height : window.innerHeight;
    var offset  = vv ? vv.offsetTop : 0;
    if (!(visible > 0)) return;

    var eaten = Math.max(0, Math.round(window.innerHeight - visible - offset));
    dock.style.transform = 'translateY(' + (-eaten) + 'px)';

    var cont = document.getElementById('terminal-container');
    if (!cont) return;
    var wanted = Math.max(60, Math.round(visible - barHeight()));
    if (cont.style.height !== wanted + 'px') {
      cont.style.height = wanted + 'px';
      scheduleFit();
    }
  }

  function follow(ms) {
    var end = Date.now() + ms;
    (function tick() {
      layout();
      if (Date.now() < end) requestAnimationFrame(tick);
    })();
  }

  if (vv) {
    vv.addEventListener('resize', layout);
    vv.addEventListener('scroll', layout);
  }
  window.addEventListener('resize', function () { follow(250); });
  document.addEventListener('focusin', function () { follow(700); }, true);
  document.addEventListener('focusout', function () { follow(700); }, true);
  window.addEventListener('orientationchange', function () { follow(900); });
  layout();

  /* ---------- finger scroll ---------- */

  /*
   A swipe becomes a `wheel` event, not `term.scrollLines()`.

   `scrollLines` moves xterm's own buffer, which does not exist under tmux — tmux is on the
   alternate screen. `wheel` is translated by xterm into mouse escape codes, and tmux
   (`mouse on`) enters copy-mode and really scrolls. Real coordinates are sent: tmux uses
   them to pick the PANE the wheel belongs to.
  */
  var THRESHOLD = 6;          // below this it is a tap, not a swipe
  var dragging = false, lastY = 0, acc = 0, passed = false, x = 0, y = 0;

  function rowHeight() {
    try {
      var screen = document.querySelector('.xterm-screen');
      var r = term().rows;
      if (screen && r) return Math.max(8, screen.clientHeight / r);
    } catch (e) {}
    return 18;
  }

  function wheel(rows, cx, cy) {
    var target = document.querySelector('.xterm-screen')
            || document.querySelector('.xterm-viewport')
            || document.querySelector('.xterm');
    if (!target) return;
    target.dispatchEvent(new WheelEvent('wheel', {
      deltaY: rows * rowHeight(), deltaMode: 0,
      clientX: cx, clientY: cy,
      bubbles: true, cancelable: true, view: window
    }));
  }

  // Listening on `document`: ttyd creates the terminal only once the WebSocket connects.
  function onDock(e) { return !!(e.target && e.target.closest && e.target.closest('#bd-dock')); }

  document.addEventListener('touchstart', function (e) {
    if (onDock(e)) return;
    if (open === 'keys') closePane();     // a tap on the terminal folds the key sheet (compose stays)
    if (e.touches.length !== 1) return;
    dragging = true; passed = false; acc = 0;
    lastY = e.touches[0].clientY;
    x = e.touches[0].clientX; y = lastY;
  }, { passive: true });

  document.addEventListener('touchmove', function (e) {
    if (!dragging || e.touches.length !== 1) return;
    var t = e.touches[0];
    var d = lastY - t.clientY;   // finger up = content moves up
    lastY = t.clientY;
    x = t.clientX; y = t.clientY;
    acc += d;

    if (!passed && Math.abs(acc) < THRESHOLD) return;   // a tap passes through untouched
    passed = true;
    e.preventDefault();                                 // the page itself must not move

    var row = rowHeight(), rows = 0;
    while (acc >= row) { rows++; acc -= row; }
    while (acc <= -row) { rows--; acc += row; }
    if (rows) wheel(rows, x, y);
  }, { passive: false });

  document.addEventListener('touchend', function () { dragging = false; }, { passive: true });
  document.addEventListener('touchcancel', function () { dragging = false; }, { passive: true });

  /* ---------- the terminal is shorter by the bar ---------- */

  // Wait for `window.term`: ttyd sets it only once the terminal is open.
  var attempts = 0;
  var waiting = setInterval(function () {
    if (term() && document.getElementById('terminal-container')) {
      clearInterval(waiting);
      layout();
      scheduleFit();
    } else if (++attempts > 200) {          // ~20 s, then give up
      clearInterval(waiting);
    }
  }, 100);
})();
</script>

<script>
/*
 3. Auto-reconnect: on a "cleanly" closed WebSocket (code 1000, e.g. the phone suspends the tab
 or the iframe sits idle in the dashboard) ttyd prints "Press ⏎ to Reconnect" and waits for
 Enter. Its handler only reopens the connection — nothing is sent to the process — so we can
 press that Enter ourselves. Applies on desktop too.

 Care: the Enter goes as a synthetic keydown to xterm's textarea, which in a LIVE session would
 reach the shell/Claude as a real Enter. So, right before sending, we re-check that the overlay
 with exactly that message is still in the DOM (as soon as the reconnect starts ttyd changes the
 text to "Reconnecting..."), and the message is looked up by the overlay node's content + inline
 style, not by terminal text.
*/
(function () {
  'use strict';
  var MESSAGE = 'Press ⏎ to Reconnect';
  var attempts = 0;

  function overlay() {
    var el = document.querySelector('.xterm');
    if (!el) return null;
    for (var i = 0; i < el.children.length; i++) {
      var d = el.children[i];
      if (d.tagName === 'DIV' && d.textContent === MESSAGE && d.style && d.style.position === 'absolute') return d;
    }
    return null;
  }

  function press() {
    var ov = overlay();
    if (!ov || !ov.isConnected) return;   // already reconnected, or the user was faster
    var ta = document.querySelector('.xterm-helper-textarea');
    if (!ta) return;
    ta.dispatchEvent(new KeyboardEvent('keydown', {
      key: 'Enter', code: 'Enter', keyCode: 13, which: 13,
      bubbles: true, cancelable: true
    }));
  }

  var scheduled = false;
  var mo = new MutationObserver(function () {
    if (scheduled || attempts > 60 || !overlay()) return;
    scheduled = true; attempts++;
    setTimeout(function () { scheduled = false; press(); }, 350);
  });
  mo.observe(document.documentElement, { childList: true, subtree: true, characterData: true });
})();
</script>

<script>
/*
 4. Clipboard and files (desktop too) — the dashboard is often used over plain HTTP (tailnet IP),
 which is NOT a "secure context" for the browser: `navigator.clipboard` does not exist and ttyd's
 auto-copy of the selection (the ✂) silently fails.

 1. COPY FALLBACK (only when there is no navigator.clipboard): on mouseup take xterm's selection
    and copy it with the old `document.execCommand('copy')`, which works on HTTP because it runs
    inside the user's click. Note: with tmux `mouse on` the selection is made with SHIFT held.

 2. FILES INTO THE TERMINAL: paste (Cmd+V) an image or drag & drop any file (up to 100 MB) onto
    the terminal. The clipboard with the image is on the laptop, while Claude reads the server's
    clipboard (which does not exist) — so the file is UPLOADED to the dashboard (:8787, CORS),
    saved under `<devRoot>/.pasted/`, and its path is typed into the prompt. Claude Code reads
    files from disk by path.
*/
(function () {
  'use strict';
  var bd = window.bd, toast = bd.toast;

  /* ---------- copy to the SYSTEM clipboard (laptop), works on HTTP too ---------- */

  /*
   Order of attempts:
     1. navigator.clipboard (https/localhost only)
     2. execCommand right away — passes in Chrome because the mouseup gesture is fresh;
        Safari refuses it outside a synchronous gesture
     3. if both fail, the text is KEPT (STASH) and a clickable toast is shown — the click is a
        new, real gesture, so execCommand passes in every browser. On top of that, Cmd+C is
        caught via the 'copy' event and writes the stashed text (the native copy command may
        write to the clipboard even on HTTP). Last line of defence: prompt() with the text
        preselected, where Cmd+C always works.
  */
  var STASH = { txt: '', t: 0 };
  function copy(text) {
    if (!text) return;
    STASH.txt = text; STASH.t = Date.now();
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(function () { toast('✂ copied'); }, function () { tryLegacy(text); });
      return;
    }
    tryLegacy(text);
  }
  function legacyCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    ta.remove();
    try { window.term && window.term.focus(); } catch (e) {}
    return ok;
  }
  function tryLegacy(text) {
    if (legacyCopy(text)) { toast('✂ copied'); return; }
    var short = text.replace(/\s+/g, ' ').slice(0, 40);
    toast('✂ CLICK HERE to copy: "' + short + '…"', false, function () {
      if (legacyCopy(text)) toast('✂ copied');
      else window.prompt('Cmd+C, then Enter:', text); // can never fail
    });
  }
  // Cmd+C after a tmux selection: the 'copy' event may write to the clipboard even on HTTP.
  // xterm's own selection (Shift-drag) takes precedence.
  document.addEventListener('copy', function (e) {
    var t = window.term;
    if (t && t.getSelection && t.getSelection()) return; // xterm handles that itself
    if (STASH.txt && Date.now() - STASH.t < 120000 && e.clipboardData) {
      e.clipboardData.setData('text/plain', STASH.txt);
      e.preventDefault();
      toast('✂ copied');
    }
  });

  /*
   OSC 52: when you drag-select in tmux (mouse on), tmux copies to ITS buffer on release and —
   because of `set-clipboard external` and a terminfo with Ms — sends an OSC 52 sequence with the
   base64 text to the outer terminal. xterm.js drops it without a handler. We catch it here and
   pour it into the real clipboard: that is the "I copied but nothing got copied" case.
  */
  function b64utf8(b64) {
    try { return decodeURIComponent(escape(atob(b64))); } catch (e) { try { return atob(b64); } catch (e2) { return ''; } }
  }
  var oscHooked = false;
  var waitTerm = setInterval(function () {
    var t = window.term;
    if (!t || !t.parser || oscHooked) { if (oscHooked) clearInterval(waitTerm); return; }
    try {
      t.parser.registerOscHandler(52, function (data) {
        var i = data.indexOf(';');
        var b64 = i >= 0 ? data.slice(i + 1) : data;
        if (b64 !== '?') { var txt = b64utf8(b64); if (txt) copy(txt); }
        return true;
      });
      oscHooked = true; clearInterval(waitTerm);
    } catch (e) { oscHooked = true; clearInterval(waitTerm); }
  }, 200);

  /* ---------- files: paste / drop ---------- */

  // capture=true: intercepts before xterm, but ONLY when the clipboard holds nothing but a file.
  // If there is ANY text, the normal paste wins — otherwise a stale screenshot in the clipboard
  // would hijack a text paste.
  document.addEventListener('paste', function (e) {
    var dt = e.clipboardData;
    if (dt && dt.getData && dt.getData('text/plain')) return; // text → normal paste
    var files = bd.filesOf(dt);
    if (files.length) { e.preventDefault(); e.stopPropagation(); files.forEach(bd.upload); }
  }, true);
  document.addEventListener('dragover', function (e) { e.preventDefault(); });
  document.addEventListener('drop', function (e) {
    e.preventDefault(); e.stopPropagation();
    var files = bd.filesOf(e.dataTransfer);
    if (files.length) files.forEach(bd.upload);
  }, true);

  /* ---------- copying a Shift-selection on HTTP ---------- */
  // Synchronously inside mouseup (no setTimeout) — Safari honours execCommand only within the
  // gesture itself. By mouseup xterm already has the final selection.
  // On a secure context ttyd does this itself, so we stay out of the way.
  if (!navigator.clipboard) {
    document.addEventListener('mouseup', function () {
      var t = window.term;
      if (!t || !t.getSelection) return;
      var sel = t.getSelection();
      if (sel) { STASH.txt = sel; STASH.t = Date.now(); if (legacyCopy(sel)) toast('✂ copied'); }
    });
  }
})();
</script>

<script>
/*
 5. Shortcuts to the dashboard. The terminal (iframe) holds focus, so the parent never sees the
 keys — we catch them here in the capture phase, BEFORE xterm, and postMessage them to the
 parent. Only Ctrl+Shift combinations that neither tmux nor Claude use:
   Ctrl+Shift+←/→   previous / next session
   Ctrl+Shift+1..9  jump to the n-th session in the list
   Ctrl+Shift+↑     back to the dashboard
   Ctrl+Shift+P     palette (same as ⌘K on the dashboard)
 Outside an iframe (own tab) there is no parent and nothing happens.
*/
(function () {
  if (window.parent === window) return;
  function post(m) { try { window.parent.postMessage(m, '*'); } catch (e) {} }
  document.addEventListener('keydown', function (e) {
    if (!(e.ctrlKey && e.shiftKey) || e.altKey || e.metaKey) return;
    var m = null;
    if (e.key === 'ArrowLeft') m = { bd: 'switch', dir: -1 };
    else if (e.key === 'ArrowRight') m = { bd: 'switch', dir: 1 };
    else if (e.key === 'ArrowUp') m = { bd: 'dashboard' };
    else if (e.key === 'P' || e.key === 'p') m = { bd: 'palette' };
    else if (/^[1-9]$/.test(e.key) || /^Digit[1-9]$/.test(e.code)) m = { bd: 'jump', n: +(e.code ? e.code.replace('Digit', '') : e.key) };
    if (!m) return;
    e.preventDefault(); e.stopImmediatePropagation();
    post(m);
  }, true);
})();
</script>
